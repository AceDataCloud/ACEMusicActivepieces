name: Publish Activepieces package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify the current immutable public package without publishing
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.verify_only && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Check release identity
        run: |
          test "$(node -p "require('./package.json').name")" = '@acedatacloud/piece-acemusic'
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"; fi
      - run: npm ci
      - run: npm test
      - name: Pack the verified files
        run: npm pack --json > "$RUNNER_TEMP/package.json"
      - name: Publish the immutable artifact with provenance
        run: |
          archive=$(jq -r '.[0].filename' "$RUNNER_TEMP/package.json")
          integrity=$(jq -r '.[0].integrity' "$RUNNER_TEMP/package.json")
          state=$(node scripts/registry-state.cjs "$integrity")
          if [[ "$state" == absent && "$GITHUB_REF_TYPE" == tag && "$VERIFY_ONLY" != true ]]; then
            npm publish "$archive" --provenance --access public --registry=https://registry.npmjs.org
          fi
          for delay in 1 2 4 8 16 32 64; do
            if [[ "$(node scripts/registry-state.cjs "$integrity")" == present ]]; then exit 0; fi
            sleep "$delay"
          done
          exit 1
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
